# Headers for every location proxied to `web`. Included per location, never set at server level:
# nginx inherits proxy_set_header only into a location that sets NONE of its own, and each location
# sets its own Connection header — so a server-level set would silently drop Host and
# X-Forwarded-Proto. See nginx.conf for why X-Forwarded-Proto is passed through, not rebuilt.
proxy_pass         http://organizer_web;
proxy_http_version 1.1;
proxy_redirect     off;
proxy_set_header   Host              $http_host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $forwarded_proto;
