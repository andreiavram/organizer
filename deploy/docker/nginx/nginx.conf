# Organizer edge inside the Coolify stack:  Traefik (TLS) -> this nginx -> web:8000
#
# A port of the vhost in README.md ("Server-side setup: MCP + OAuth 2.1"). Traefik terminates TLS and
# owns the certificate; everything else that vhost did lives here, so the browser, the SPA and MCP
# clients see the same single origin as on the old host:
#   * the Angular bundle at / with client-side-routing fallback,
#   * /static/ (Django admin, DRF) from collectstatic,
#   * the backend prefixes proxied to uvicorn, /mcp unbuffered and /ws/ upgraded.
#
# The one line that must differ from the old vhost: X-Forwarded-Proto is passed THROUGH from
# Traefik, never rebuilt from $scheme. There nginx was the TLS edge, so $scheme was https; here nginx
# only ever speaks plain HTTP to Traefik, so $scheme is always "http". Forwarding it would make
# request.is_secure() false — the admin login POST fails the CSRF Origin check, and the OAuth /
# protected-resource metadata advertises http:// URLs.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    # Trust the client address Traefik reports (only the private ranges Docker networks use).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Traefik always sets X-Forwarded-Proto; default to https if it is ever missing rather than
    # silently downgrading every request to http.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      https;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # A name unique on the shared `coolify` network — see docker-compose.coolify.yml. Plain `web`
    # also resolves to other stacks' web containers.
    upstream organizer_web {
        server organizer-web:8000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 10M;

        root /srv/spa;
        index index.html;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # Django backend. Everything that is not the SPA, listed explicitly because `location /`
        # below serves the bundle, not a backend catch-all. Keep in step with frontend/ngsw-config.json
        # navigationUrls (the service worker must not answer these with index.html either).
        # `^~` so a request like /admin/foo.js is proxied, not matched by the asset regex below.
        location ^~ /api/          { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; }
        location ^~ /rest-auth/    { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; }
        location ^~ /admin/        { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; }
        location ^~ /o/            { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; }
        # Third-party OAuth callbacks (Notion, VolunHub): plain browser navigations.
        location ^~ /integrations/ { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; }
        location ^~ /.well-known/oauth- { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; }
        location = /healthz/       { include /etc/nginx/organizer-proxy.conf; proxy_set_header Connection ""; access_log off; }

        # MCP endpoint — must stream (SSE): no buffering, long read timeout, keep-alive.
        location ^~ /mcp {
            include /etc/nginx/organizer-proxy.conf;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Real-time task sync — the OPPOSITE of /mcp: a WS upgrade needs `Connection: upgrade`.
        location ^~ /ws/ {
            include /etc/nginx/organizer-proxy.conf;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;   # idle sockets stay open (heartbeats are ~25s apart)
            proxy_send_timeout 3600s;
        }

        location ^~ /static/ {
            alias /srv/static/;
            expires 7d;
            access_log off;
        }

        # The service worker's control files and the shell must revalidate, or a deploy is invisible
        # until the old worker gives up.
        location = /index.html     { add_header Cache-Control "no-cache"; }
        location = /ngsw.json      { add_header Cache-Control "no-cache"; }
        location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }

        # Angular's hashed bundles never change under the same name.
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp|webmanifest)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # SPA client-side routing.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
