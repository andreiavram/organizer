name: deploy-frontend

# Builds the Angular SPA and deploys the static bundle to the web root on push to
# `develop`. Inspired by the weinland UI deploy workflow.
#
# Required GitHub config (Settings → Secrets and variables → Actions):
#   Variables: SSH_USER, SSH_HOST, SSH_PORT, FRONTEND_WEB_ROOT (e.g. /var/www/organizer)
#   Secrets:   SSH_KEY (private key authorised on the server)
#
# Coolify: the bundle is built into the `edge` image instead; DEPLOY_TARGET_PRODUCTION=coolify skips
# the SSH steps and runs deploy-coolify (see deploy-backend.yaml for its variables).

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'
      - 'Dockerfile'
      - 'deploy/docker/nginx/**'
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yaml'
      - 'Dockerfile'
      - 'deploy/docker/nginx/**'

jobs:
  test_and_build:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      # --- Deploy (only on push to develop / manual dispatch) ---
      - name: Configure SSH
        if: vars.DEPLOY_TARGET_PRODUCTION != 'coolify' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
        env:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END

      - name: Bundle dist
        if: vars.DEPLOY_TARGET_PRODUCTION != 'coolify' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
        run: tar czf organizer-dist.tar.gz -C frontend/dist/organizer-frontend/browser .

      - name: Copy bundle to server
        if: vars.DEPLOY_TARGET_PRODUCTION != 'coolify' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
        run: 'scp organizer-dist.tar.gz production:'

      - name: Unpack into web root
        if: vars.DEPLOY_TARGET_PRODUCTION != 'coolify' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
        run: |
          # No sudo: the deploy user owns $WEB_ROOT (one-time on the server:
          #   sudo mkdir -p /var/www/organizer
          #   sudo chown -R "$USER" /var/www/organizer
          # ). A non-interactive CI ssh session has no TTY to enter a sudo password.
          ssh production '
            set -euo pipefail
            WEB_ROOT="${{ vars.FRONTEND_WEB_ROOT }}"
            mkdir -p "$WEB_ROOT"
            rm -rf "${WEB_ROOT:?}/"*
            tar xzf organizer-dist.tar.gz -C "$WEB_ROOT"
            rm -f organizer-dist.tar.gz
          '

  deploy-coolify:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    environment: production
    needs: test_and_build
    # Exactly one of the legacy SSH deploy and this one runs, chosen by DEPLOY_TARGET_PRODUCTION
    # (unset = legacy). Coolify builds the images itself; this job only triggers, waits and
    # smoke-tests. See deploy/coolify/README.md.
    if: vars.DEPLOY_TARGET_PRODUCTION == 'coolify' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    # Shared with the other deploy workflow: a push touching backend and frontend queues the second
    # deploy behind the first instead of overlapping two migrations.
    concurrency:
      group: deploy-coolify-production
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      APP_UUID: ${{ vars.COOLIFY_APP_UUID_PRODUCTION }}
      SMOKE_URL: ${{ vars.SMOKE_URL_PRODUCTION }}
      DEPLOY_TIMEOUT: "1620"
    steps:
      - name: Fetch the deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/coolify
          fetch-depth: 1
      - name: Deploy and wait
        run: bash deploy/coolify/deploy.sh
